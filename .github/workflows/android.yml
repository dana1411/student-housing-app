name: Android app

# Builds an installable APK. Download it from the run's "Artifacts" section.
# With the SUPABASE secrets set, the APK uses the live backend; without them it runs in demo mode.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK on the Releases page

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build the web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_URL: ${{ secrets.VITE_PUBLIC_URL }}
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        # retries: Gradle downloads its tools from GitHub, which sometimes times out
        run: |
          chmod +x gradlew
          for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && exit 0; echo "Build attempt $i failed, retrying in 30s"; sleep 30; done
          exit 1
      # Easiest place to get it on a phone: the repo's Releases page, "Android app (latest build)".
      - name: Publish the APK on the Releases page
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(node -p "require('./app.config.json').name.replace(/[^A-Za-z0-9]+/g,'-')")
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME.apk"
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "$NAME.apk" --title "Android app (latest build)" --target "$GITHUB_SHA" \
            --notes "Test build from $(date -u +'%d %b %Y %H:%M') UTC. On your Android phone: tap the .apk file below to download it, open it, and allow installing from this source when asked."
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      # Signed release for the Play Store, only when the signing secrets exist.
      - name: Build signed release (AAB)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
